name: แจ้งเตือนผู้เล่น
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: push-notify
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save --no-audit --no-fund
      - run: node push-send.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
